equipment_eyebrow: the equipment
equipment_headline: The FlowFormer.
equipment_body: Every reformer class is taught on the FlowFormer — our custom reformer and the foundation of the Flowhouse Method, developed specifically for the way we teach. The studio holds ten of them, with matte-black frames, the flowhouse wordmark on the side rail, and overhead cable straps for long-lever upper-body work.
equipment_body_2: Alongside them, two barre walls — solid wood barres on minimal black hardware. One is for our Barre 45 classes, with twenty-five spots; the other is for warmups and stretch.
equipment_note: New to the reformer? Start with an Intro class — paced and cued for first-time movers, the place to learn the reformer before anything else.
equipment_image: /images/uploads/flowformer-studio-3-4.jpg
equipment_image_alt: A member standing among the FlowFormer reformers in the walnut-lined flowhouse studio

experience_eyebrow: the experience
experience_headline: More than a workout.
experience_body: Warm walnut feature walls, large sphere pendant lighting, and a calm coastal palette — designed to slow you down the moment you walk in. Every class closes with a slow stretch and cool down, so you walk out taller than you came in.
experience_body_2: Then stay. Grab a juice, chat with the community, and linger in the calm. The hour on the FlowFormer is the start of the ritual — not the end of it.
