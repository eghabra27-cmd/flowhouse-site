eyebrow: Rehoboth Beach · Coastal Highway
headline_html: Your local <span class="serif-italic">movement sanctuary.</span>
lead: flowhouse is a coastal movement sanctuary blending reformer pilates, barre, and intentional strength — designed to feel equal parts grounding, elevated, and alive.
body: Our 50-minute reformer classes are sequenced for time under tension, continuous movement, and breath-led pacing — low-impact strength that supports the body long-term. Barre 45 rounds out the week with alignment, muscular endurance, and a full-body burn without high-impact stress.
