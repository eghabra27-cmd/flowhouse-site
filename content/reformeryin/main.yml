who:
  eyebrow: who it's for
  title: Come as you are.
  body: Reformer Yin is an option for anyone who wants to combine strength work with flexibility, stillness, and recovery — whether you train often and want a counterbalance, or you're looking for a slower, more intentional way to move.
  points:
    - title: Modifications, always
      body: Your instructor can offer modifications and options throughout class, so every movement can meet you where you are.
    - title: Your own range
      body: You're encouraged to move within a range that feels comfortable for you — never forced, never rushed.
    - title: New to the reformer?
      body: Beginners start with an Intro class to learn the FlowFormer before stepping into the full schedule.
