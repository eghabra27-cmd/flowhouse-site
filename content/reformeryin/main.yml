method:
  eyebrow: the method
  title: Two practices. <span class="serif-italic">One experience.</span>
  intro: Reformer Yin is a 50-minute class in two parts. It begins with strength and ends in stillness — so you leave having worked, and having rested.
  image: /images/uploads/reformer-yin-method.jpg
  image_alt: A flowhouse client in a long side stretch on the reformer against the walnut wood-slat wall.
  parts:
    - minutes: "30"
      label: minutes
      title: Reformer Pilates
      body: Controlled, strength-focused work on the reformer. Spring resistance, a steady tempo, and precise form build heat without rushing.
    - minutes: "20"
      label: minutes
      title: Yin-inspired stretching
      body: Slow, restorative stretches held for longer, with time to settle into each shape and soften your breath.
  closing: Active movement, then stillness. Effort, then ease.

why:
  eyebrow: why we practice
  title: What it can support.
  intro: Reformer Yin pairs two kinds of work in one class. Here's what each part is designed to support — and, as with any practice, results build gradually with consistency.
  items:
    - title: Strength & muscular endurance
      body: Reformer Pilates is a form of resistance training — springs load the muscles through slow, controlled, repeated movement. Studies of regular Pilates practice have reported improvements in muscular endurance and core strength over time.
    - title: Flexibility & mobility
      body: The Yin portion holds supported stretches for longer than a typical cool-down. Regular stretching is associated with improved flexibility and range of motion, especially when it becomes part of your routine.
    - title: Body awareness & mindful movement
      body: A slower pace and clear cueing invite you to notice alignment, effort, and breath as you move — attention that can carry into the rest of your training.
    - title: Relaxation & recovery
      body: Quieter, supported positions and slow, steady breathing give you space to downshift after effort. Many people find this part of class calming — a chance to reset before the rest of the day.
    - title: A more balanced routine
      body: Most workouts are all effort. Pairing strength work with dedicated time for mobility and rest helps round out your week — a natural counterbalance to Signature, Barre, and Fusion.
  note: Reformer Yin is a movement class, not medical treatment. If you're pregnant, recovering from an injury, or managing a health condition, check with your healthcare provider first and let your instructor know before class.

