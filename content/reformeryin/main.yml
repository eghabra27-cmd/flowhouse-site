  image_alt: Black-and-white image of a flowhouse client in a slow, reaching stretch on the FlowFormer, holding a strap overhead.

method:
  eyebrow: the method
  title: Slow holds. <span class="serif-italic">Long lines.</span>
  intro: Reformer Yin is our restorative reformer-based stretch and recovery class, inspired by yin yoga principles. Fifty minutes of slow, supported movement — no strength block, no rush.
  image: /images/uploads/reformer-yin-method.jpg
  image_alt: A flowhouse client in a long side stretch on the reformer against the walnut wood-slat wall.
  parts:
    - minutes: "01"
      label: the hold
      title: Longer, supported holds
      body: The reformer supports you as you settle into each stretch and stay a little longer, so the body has time to soften.
    - minutes: "02"
      label: the release
      title: Myofascial release
      body: Slow, sustained work through muscle and the connective tissue around it (fascia), paired with gentle stretching.
    - minutes: "03"
      label: the breath
      title: Breath-led pacing
      body: Breathwork sets the tempo of class. Each transition moves at the pace of your breath, not the clock.
  closing: Supported movement. Longer holds. Room to recover.

why:
  eyebrow: why we practice
  title: What it can support.
  intro: Reformer Yin is built for recovery, not intensity. Here's what the class is designed to support — and, as with any practice, results build gradually with consistency.
  items:
    - title: Flexibility & mobility
      body: Supported stretches are held longer than a typical cool-down. Regular stretching is associated with improved flexibility and range of motion, especially when it becomes part of your routine.
    - title: Fascia & myofascial release
      body: Myofascial release uses slow, sustained pressure and stretch through muscle and connective tissue. Many people say it helps them feel less tight; research into exactly how it works is still developing.
    - title: Relaxation & recovery
      body: Quiet, supported positions and slow, steady breathing give you space to downshift. Many people find the class calming — a chance to reset between harder training days.
    - title: Body awareness & mindful movement
      body: A slower pace and clear cueing invite you to notice alignment, sensation, and breath — attention that can carry into the rest of your training.
    - title: A more balanced routine
      body: Most workouts are all effort. A dedicated restorative class helps round out your week — the counterbalance to Signature, Barre, and Fusion.
  note: Reformer Yin is a movement class, not medical treatment. If you're pregnant, recovering from an injury, or managing a health condition, check with your healthcare provider first and let your instructor know before class.

