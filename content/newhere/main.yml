welcome_image: /images/uploads/Tezza-1149.JPG
welcome_headline: We're so excited to welcome you to flowhouse.
welcome_sub: "Here's what to know before your first class:"
cards:
  - icon: clock
    title: Arrive early
    body: First-timers should arrive about ten minutes before class for a short orientation and FlowFormer setup — your instructor will walk you through the carriage, platform, springs, straps, and safety features.
  - icon: sock
    title: Grip socks required
    body: Required for safety and hygiene. Available for purchase in the studio if you need a pair.
  - icon: bottle
    title: Come ready to move
    body: Bring water and wear comfortable, fitted movement clothing you can move freely in. Phones stay silent and stored away so the room stays calm.
  - icon: phone
    title: Connect with us
    body: Download the Flow House app to book classes, manage your membership, and stay connected — all in one place.
    app: true

