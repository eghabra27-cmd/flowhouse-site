# "New here" page — modeled on jetsetpilates.com/new, in the flowhouse brand.
# Copy is drawn from facts already on the site (what to expect, first-class notes, glossary) and real Google reviews.
hero_eyebrow: new here
hero_headline_html: Not another pilates studio. <span class="serif-italic">A method of our own.</span>
hero_lead: The Flowhouse experience blends contemporary Pilates with modern strength training on the FlowFormer — our custom reformer. Slow tempo, time under tension, breath, precision, and control, sequenced into one continuous flow.

expect_image: /images/uploads/Tezza-4228.JPG
expect_image_alt: A flowhouse class working on the FlowFormer reformers beneath the studio's sphere pendant lights
expect_intro: "Within one of our signature 50-minute classes, you can expect:"
expect_items:
  - Breath work and deep-core activation on the FlowFormer — we start the conversation from the inside out.
  - Lower body, oblique, and upper body blocks — time-under-tension reps, slow eccentrics, and long-lever arms on the cables.
  - One continuous, breath-led flow. Your instructor guides every movement, transition, and spring change, and modifications are always available.
  - A final core push, then a slow stretch and cool down — you'll walk out taller than you came in.
expect_note: "First time on the reformer? Start with an Intro class — paced and cued for first-time movers, the place to learn the reformer before anything else."

